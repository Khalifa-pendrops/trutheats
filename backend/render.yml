services:
  - type: web
    name: trusteats-backend
    runtime: node
    rootDir: .
    buildCommand: yarn install --frozen-lockfile && yarn build
    startCommand: node dist/app.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false
      - key: BASE_URL
        sync: false
      - key: PASSWORD_RESET_SECRET
        sync: false
      - key: PASSWORD_RESET_EXPIRES_IN
        value: 1h
